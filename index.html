<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Ôn từ vựng Đông Du</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

<h2>🌸 Ôn từ vựng Đông Du</h2>

<select id="unitSelect"></select>

<select id="mode">
  <option value="mcq">Trắc nghiệm</option>
  <option value="typing">Nhập đáp án</option>
  <option value="wrong">Ôn từ sai</option>
</select>

<select id="direction">
  <option value="jpvi">Nhật → Việt</option>
  <option value="vijp">Việt → Nhật</option>
</select>

<div id="card"></div>

<div id="choices"></div>

<div id="typingBox">
  <input id="answer">
  <button onclick="checkTyping()">OK</button>
</div>

<p id="stats"></p>

</div>

<script src="app.js"></script>

</body>
</html>
