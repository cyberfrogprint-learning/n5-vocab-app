<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🇯🇵 N5 Vocab Trainer Pro Max</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap');
        body {
            margin:0; font-family: 'Noto Sans JP', sans-serif;
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://img4.thuthuatphanmem.vn/uploads/2019/12/21/hinh-anh-nhat-ban-tuyet-dep-dinh-dai-lau-cac-nhin-ra-nui-phu_6dwkE_104011946.jpg') center/cover fixed;
            color:#333; min-height:100vh; display:flex; justify-content:center; align-items:center;
        }
        .app { width:95%; max-width:500px; background:rgba(255,255,255,0.97); border-radius:28px; padding:20px; box-shadow:0 25px 60px rgba(0,0,0,0.3); }
        h1 { text-align:center; color:#d32f2f; margin:0 0 15px; }
        .tab { display:flex; gap:5px; margin-bottom:15px; }
        .tab button { flex:1; padding:10px; border:none; border-radius:12px; font-weight:bold; cursor:pointer; }
        .tab button.active { background:#ff5a5f; color:white; }
        .controls, .dict-controls { display:flex; gap:8px; margin-bottom:10px; }
        input, select, button { padding:10px 14px; border-radius:12px; border:none; font-size:16px; }
        .btn { background:#ff5a5f; color:white; font-weight:bold; cursor:pointer; }
        .card { position:relative; min-height:180px; display:flex; align-items:center; justify-content:center; font-size:32px; font-weight:bold; background:white; border-radius:24px; margin:15px 0; padding:25px; box-shadow:0 10px 30px rgba(0,0,0,0.15); cursor:pointer; }
        .back { position:absolute; inset:0; background:#e3f2fd; display:none; align-items:center; justify-content:center; font-size:24px; color:#1565c0; border-radius:24px; flex-direction:column; gap:8px; }
        .dictionary { max-height:420px; overflow-y:auto; background:#f9f9f9; border-radius:16px; padding:10px; display:none; }
        .dict-item { padding:12px; background:white; margin:6px 0; border-radius:12px; border-left:4px solid #ff5a5f; cursor:pointer; }
        .message { padding:12px; border-radius:12px; text-align:center; margin:10px 0; font-weight:bold; }
    </style>
</head>
<body>
    <div class="app">
        <h1>🇯🇵 N5 Vocab Trainer Pro Max</h1>
        
        <div class="tab">
            <button onclick="switchTab(0)" class="active" id="tab0">Học</button>
            <button onclick="switchTab(1)" id="tab1">Từ Điển Online</button>
        </div>

        <!-- Phần Học (code cũ của mày) -->
        <div id="studyPanel">
            <div class="controls">
                <select id="mode">...</select>
                <!-- các nút khác giữ nguyên -->
            </div>
            <!-- card, typing, quiz... -->
        </div>

        <!-- Phần Từ Điển Online -->
        <div id="dictPanel" style="display:none;">
            <div class="dict-controls">
                <input type="text" id="dictSearch" placeholder="Nhập từ tiếng Nhật hoặc Việt..." style="flex:1;" onkeypress="if(event.key==='Enter') searchDictionary()">
                <button class="btn" onclick="searchDictionary()">🔍 Tra</button>
            </div>
            <div id="dictionary" class="dictionary"></div>
        </div>
    </div>

    <script>
        // === TỪ ĐIỂN ONLINE ===
        async function searchDictionary() {
            const query = document.getElementById('dictSearch').value.trim();
            if (!query) return;
            
            const dictDiv = document.getElementById('dictionary');
            dictDiv.innerHTML = '<p>Đang tra từ điển...</p>';
            dictDiv.style.display = 'block';

            try {
                const res = await fetch(`https://jisho.org/api/v1/search/words?keyword=${encodeURIComponent(query)}`);
                const json = await res.json();

                if (json.data.length === 0) {
                    dictDiv.innerHTML = `<p>Không tìm thấy từ "${query}"</p>`;
                    return;
                }

                let html = '';
                json.data.forEach(entry => {
                    const japanese = entry.japanese[0];
                    const senses = entry.senses[0]?.english_definitions.join(', ') || 'Không có nghĩa';
                    
                    html += `
                        <div class="dict-item" onclick="speak('${japanese.word || japanese.reading}')">
                            <strong>${japanese.word || japanese.reading}</strong> 
                            <small>(${japanese.reading})</small><br>
                            <em>${senses}</em>
                        </div>`;
                });
                dictDiv.innerHTML = html;
            } catch(e) {
                dictDiv.innerHTML = '<p>Lỗi kết nối từ điển. Thử lại sau.</p>';
            }
        }

        function speak(text) {
            if ('speechSynthesis' in window) {
                const u = new SpeechSynthesisUtterance(text);
                u.lang = 'ja-JP';
                speechSynthesis.speak(u);
            }
        }

        function switchTab(n) {
            document.getElementById('studyPanel').style.display = n === 0 ? 'block' : 'none';
            document.getElementById('dictPanel').style.display = n === 1 ? 'block' : 'none';
            
            document.querySelectorAll('.tab button').forEach((b,i) => {
                b.classList.toggle('active', i === n);
            });
        }

        // Giữ nguyên các hàm loadSheet, nextCard, flashcard... từ code trước
    </script>
</body>
</html>
