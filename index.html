<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🇯🇵 N5 Vocab Trainer Pro</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap');
        
        body {
            margin: 0; padding: 0;
            font-family: 'Noto Sans JP', system-ui, sans-serif;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://img4.thuthuatphanmem.vn/uploads/2019/12/21/hinh-anh-nhat-ban-tuyet-dep-dinh-dai-lau-cac-nhin-ra-nui-phu_6dwkE_104011946.jpg') center/cover fixed;
            color: #333;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .app {
            width: 90%;
            max-width: 460px;
            background: rgba(255,255,255,0.96);
            border-radius: 28px;
            padding: 24px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.25);
        }
        h1 { font-size: 28px; margin: 0 0 16px; color: #d32f2f; text-align:center; }
        
        .controls { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; justify-content: center; }
        select, input, button { padding: 10px 14px; border-radius: 12px; border: none; font-size: 16px; }
        .btn { background: #ff5a5f; color: white; font-weight: bold; cursor: pointer; }
        .btn-small { padding: 8px 12px; font-size: 14px; }

        .card {
            position: relative;
            min-height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
            background: white;
            border-radius: 24px;
            margin: 20px 0;
            padding: 30px 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            cursor: pointer;
            transition: all 0.3s;
        }
        .card:active { transform: scale(0.97); }

        .back { 
            position: absolute; inset: 0; background: #e3f2fd; 
            display: none; align-items: center; justify-content: center; 
            font-size: 26px; color: #1565c0; border-radius: 24px; 
        }

        .stats { font-size: 18px; font-weight: bold; margin: 12px 0; text-align:center; }
        .message { padding: 12px; border-radius: 12px; margin: 10px 0; font-weight: bold; text-align:center; }
        .success { background:#c8e6c9; color:#2e7d32; }
        .error { background:#ffcdd2; color:#c62828; }

        .choices { display: grid; gap: 10px; }
        .choice-btn { 
            padding: 16px; background: white; border: 2px solid #ddd; 
            border-radius: 16px; font-size: 17px; cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="app">
        <h1>🇯🇵 N5 Vocab Trainer Pro</h1>
        
        <div class="controls">
            <select id="mode">
                <option value="flash">Flashcard</option>
                <option value="typing">Gõ Từ</option>
                <option value="quiz">Trắc Nghiệm</option>
                <option value="wrong">Từ Sai</option>
            </select>
            <select id="lessonFilter">
                <option value="">Tất cả Lesson</option>
            </select>
            <button class="btn" onclick="toggleDark()">🌙</button>
            <button class="btn btn-small" onclick="speakCurrent()">🔊</button>
        </div>

        <input type="text" id="sheetUrl" placeholder="Dán link CSV Google Sheet vào đây" style="width:100%; margin:8px 0; padding:12px;">
        <button class="btn" onclick="loadSheet()" style="width:100%; margin-bottom:12px;">🔄 Load Dữ Liệu từ Sheet</button>

        <div id="card" class="card">
            <div id="front">Nhấn Load để bắt đầu</div>
            <div id="back" class="back"></div>
        </div>

        <div id="typingContainer" style="display:none;">
            <input type="text" id="answer" placeholder="Nhập nghĩa tiếng Việt..." style="width:100%; padding:14px; margin:10px 0;">
            <button class="btn" onclick="checkTyping()" style="width:100%;">Kiểm tra</button>
        </div>

        <div id="quizContainer" style="display:none;" class="choices"></div>

        <div class="stats" id="stats">Đúng: 0 / Tổng: 0</div>
        <div id="message" class="message" style="display:none;"></div>
    </div>

    <script>
        let data = [];
        let wrongWords = JSON.parse(localStorage.getItem("wrongWords")) || {};
        let current = null;
        let correct = 0, total = 0;
        let currentMode = 'flash';
        let currentLessonFilter = '';

        const front = document.getElementById('front');
        const back = document.getElementById('back');
        const card = document.getElementById('card');
        const statsEl = document.getElementById('stats');
        const modeSelect = document.getElementById('mode');
        const lessonFilter = document.getElementById('lessonFilter');
        const typingContainer = document.getElementById('typingContainer');
        const quizContainer = document.getElementById('quizContainer');
        const answerInput = document.getElementById('answer');
        const choicesEl = document.getElementById('quizContainer');
        const sheetUrlInput = document.getElementById('sheetUrl');
        const messageEl = document.getElementById('message');

        // Parse CSV tốt hơn
        function parseCSVLine(line) {
            const result = [];
            let current = '';
            let inQuotes = false;
            for (let i = 0; i < line.length; i++) {
                const char = line[i];
                if (char === '"') {
                    inQuotes = !inQuotes;
                } else if (char === ',' && !inQuotes) {
                    result.push(current.trim());
                    current = '';
                } else {
                    current += char;
                }
            }
            result.push(current.trim());
            return result;
        }

        async function loadSheet() {
            let url = sheetUrlInput.value.trim();
            if (!url) return showMessage("Dán link CSV trước!", "error");

            try {
                const res = await fetch(url);
                if (!res.ok) throw new Error("Fetch failed");
                
                const text = await res.text();
                const rows = text.split('\n').slice(1); // bỏ header
                
                data = [];
                rows.forEach(r => {
                    if (!r.trim()) return;
                    const cols = parseCSVLine(r);
                    const jp = cols[0] ? cols[0].replace(/^"|"$/g, '').trim() : '';
                    const vi = cols[1] ? cols[1].replace(/^"|"$/g, '').trim() : '';
                    const lesson = cols[2] ? cols[2].replace(/^"|"$/g, '').trim() : '';
                    
                    if (jp && vi) {
                        data.push({ jp, vi, lesson });
                    }
                });

                if (data.length > 0) {
                    populateLessonFilter();
                    showMessage(`✅ Tải thành công ${data.length} từ!`, "success");
                    nextCard();
                } else {
                    showMessage("Không tìm thấy dữ liệu", "error");
                }
            } catch (e) {
                console.error(e);
                showMessage("❌ Lỗi load. Kiểm tra link đã public chưa?", "error");
            }
        }

        function populateLessonFilter() {
            const lessons = [...new Set(data.map(item => item.lesson).filter(Boolean))].sort((a,b) => a - b);
            lessonFilter.innerHTML = '<option value="">Tất cả Lesson</option>';
            lessons.forEach(l => {
                const opt = document.createElement('option');
                opt.value = l;
                opt.textContent = `Lesson ${l}`;
                lessonFilter.appendChild(opt);
            });
            lessonFilter.onchange = () => {
                currentLessonFilter = lessonFilter.value;
                nextCard();
            };
        }

        function getCurrentList() {
            let list = data;
            if (currentMode === 'wrong') list = Object.values(wrongWords);
            if (currentLessonFilter) {
                list = list.filter(item => item.lesson === currentLessonFilter);
            }
            return list;
        }

        function nextCard() {
            choicesEl.innerHTML = '';
            answerInput.value = '';
            back.style.display = 'none';

            const list = getCurrentList();
            if (list.length === 0) {
                front.textContent = "Không có dữ liệu!";
                return;
            }

            current = list[Math.floor(Math.random() * list.length)];
            front.textContent = current.jp;
            back.textContent = current.vi;

            typingContainer.style.display = currentMode === 'typing' ? 'block' : 'none';
            quizContainer.style.display = currentMode === 'quiz' ? 'block' : 'none';

            if (currentMode === 'quiz') renderChoices(list);
        }

        function renderChoices(list) {
            let opts = [current.vi];
            while (opts.length < 4) {
                const randVi = list[Math.floor(Math.random() * list.length)].vi;
                if (!opts.includes(randVi)) opts.push(randVi);
            }
            opts.sort(() => Math.random() - 0.5);

            choicesEl.innerHTML = '';
            opts.forEach(o => {
                const b = document.createElement('button');
                b.className = 'choice-btn';
                b.textContent = o;
                b.onclick = () => checkQuiz(o);
                choicesEl.appendChild(b);
            });
        }

        function checkQuiz(ans) {
            total++;
            if (ans === current.vi) {
                correct++;
                showMessage("🎉 Đúng rồi!", "success");
            } else {
                saveWrong(current);
                showMessage(`❌ Sai → ${current.vi}`, "error");
            }
            updateStats();
            setTimeout(nextCard, 1500);
        }

        function checkTyping() {
            if (!answerInput.value.trim()) return;
            total++;
            const userAns = answerInput.value.trim().toLowerCase();
            const correctAns = current.vi.toLowerCase();

            if (userAns === correctAns || correctAns.includes(userAns)) {
                correct++;
                showMessage("🎉 Đúng!", "success");
            } else {
                saveWrong(current);
                showMessage(`❌ Sai → ${current.vi}`, "error");
            }
            updateStats();
            setTimeout(nextCard, 1500);
        }

        function saveWrong(w) {
            wrongWords[w.jp] = w;
            localStorage.setItem("wrongWords", JSON.stringify(wrongWords));
        }

        function updateStats() {
            statsEl.textContent = `Đúng: ${correct} / Tổng: ${total}`;
        }

        function showMessage(txt, type) {
            messageEl.textContent = txt;
            messageEl.className = `message ${type}`;
            messageEl.style.display = 'block';
            setTimeout(() => messageEl.style.display = 'none', 2500);
        }

        function toggleDark() {
            document.body.classList.toggle('dark');
        }

        function speakCurrent() {
            if (!current || !speechSynthesis) return;
            const utterance = new SpeechSynthesisUtterance(current.jp);
            utterance.lang = 'ja-JP';
            speechSynthesis.speak(utterance);
        }

        // Event listeners
        card.onclick = () => {
            if (currentMode === 'flash') {
                back.style.display = back.style.display === 'flex' ? 'none' : 'flex';
            }
        };

        modeSelect.onchange = () => {
            currentMode = modeSelect.value;
            nextCard();
        };

        answerInput.addEventListener('keypress', e => {
            if (e.key === 'Enter') checkTyping();
        });

        // Khởi động
        window.onload = () => updateStats();
    </script>
</body>
</html>
