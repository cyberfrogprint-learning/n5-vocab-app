<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Học từ vựng N5</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>📘 Học từ vựng N5</h1>

<div class="controls">
  <select id="lessonFilter">
    <option value="all">Tất cả</option>
  </select>

  <button onclick="shuffleWords()">🔀 Trộn</button>
  <button onclick="toggleMode()">🔁 JP ⇄ VI</button>
</div>

<div class="card" onclick="flipCard()">
  <div id="front">Loading...</div>
  <div id="back" class="hidden"></div>
</div>

<div class="actions">
  <button onclick="nextWord()">➡️ Tiếp</button>
</div>

<script src="app.js"></script>
</body>
</html>
