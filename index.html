<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>N5 Trainer Pro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <h1>📘 N5 Trainer</h1>

  <div class="progress">
    <div id="progress-bar"></div>
  </div>

  <div class="card" onclick="flipCard()">
    <div id="card-inner">
      <div class="card-front" id="front">Start</div>
      <div class="card-back" id="back">...</div>
    </div>
  </div>

  <div class="controls">
    <button onclick="prevWord()">⬅</button>
    <button onclick="nextWord()">➡</button>
    <button onclick="toggleSave()">⭐</button>
  </div>

  <h2>Quiz</h2>
  <div id="quiz"></div>

  <button onclick="toggleDarkMode()">🌙 Dark Mode</button>

</div>

<script src="app.js"></script>
</body>
</html>
